<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script id="appearance-init">
      // Apply the saved interface mode before styles and React paint.
      (function () {
        var mode = 'system';
        try {
          var saved = window.localStorage.getItem('tyx-signature.appearance.v1');
          if (saved === 'light' || saved === 'dark') mode = saved;
        } catch (_) {}
        var theme = mode;
        if (mode === 'system') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themeMode = mode;
        document.documentElement.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#171717' : '#ffffff');
      }());
    </script>
    <meta name="description" content="输入英文名字或拼音，设计连笔签名与情侣动态签名，在浏览器导出 MP4 视频或透明 GIF 动图。" />
    <title>tyx-动态签名</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web/main.tsx"></script>
  </body>
</html>
